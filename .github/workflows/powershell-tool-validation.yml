name: PowerShell tooling validation

on:
  push:
    branches:
      - main
      - workflows/ea-quality-cycle-2026-11-11
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-validation:
    name: Windows PowerShell 5.1 regression suite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Windows PowerShell version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)"
          }
          $PSVersionTable.PSVersion.ToString()

      - name: Run PowerShell tooling regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\ValidationHarness.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "ValidationHarness.Tests.ps1 failed with exit code $LASTEXITCODE"
          }

  ea-compile-validation:
    name: AlgoMultiAssetEA compile gate (requires MetaTrader 5)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check MetaEditor availability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $metaEditorPaths = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files\MetaQuotes\Terminal\*\metaeditor64.exe",
            "${env:ProgramFiles}\MetaTrader 5\metaeditor64.exe",
            "${env:ProgramFiles}\AMarkets - MetaTrader 5\metaeditor64.exe"
          )
          $found = $false
          foreach ($path in $metaEditorPaths) {
            $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Host "Found MetaEditor at: $resolved"
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Warning "MetaEditor not found on this runner. EA compilation requires a self-hosted runner with MetaTrader 5 installed."
            Write-Host "Skipping EA compile on GitHub-hosted runner."
            exit 0
          }
          echo "METAEDITOR_FOUND=true" >> $env:GITHUB_ENV

      - name: Validate EA source structure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $eaPath = "Experts\AlgoMultiAssetEA.mq5"
          $includeRoot = "Include"
          
          if (-not (Test-Path -LiteralPath $eaPath)) {
            throw "EA source not found: $eaPath"
          }
          
          if (-not (Test-Path -LiteralPath $includeRoot)) {
            throw "Include root not found: $includeRoot"
          }
          
          # Basic syntax check - verify #include paths resolve
          $content = Get-Content -LiteralPath $eaPath -Raw
          $includes = [regex]::Matches($content, '#include\s+"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          
          $missingIncludes = @()
          foreach ($inc in $includes) {
            $fullPath = Join-Path $includeRoot $inc
            if (-not (Test-Path -LiteralPath $fullPath)) {
              $missingIncludes += $fullPath
            }
          }
          
          if ($missingIncludes.Count -gt 0) {
            throw "Missing include files: $($missingIncludes -join ', ')"
          }
          
          Write-Host "EA source structure validation passed. Includes resolved: $($includes.Count)"

      - name: Compile AlgoMultiAssetEA (requires MetaEditor)
        if: env.METAEDITOR_FOUND == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Compile-MT5.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Compile-MT5.ps1 failed with exit code $LASTEXITCODE"
          }
